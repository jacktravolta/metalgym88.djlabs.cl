<!--
  Content-Security-Policy. GitHub Pages cannot send response headers, so the
  policy travels as a meta tag (the _headers file next to the bundle covers
  the Cloudflare Pages case).

  The three inline scripts are allowed by their sha256 hash, not by
  'unsafe-inline': the Google Tag Manager bootstrap, the theme script (which
  has to run before the first paint, or the app would flash the wrong theme)
  and the API base. The policy still forbids any other inline code.
  Recompute the hashes after editing any inline script:

    node -e "const fs=require('fs'),c=require('crypto');const h=fs.readFileSync('index.html','utf8');[...h.matchAll(/<script(?![^>]*src=)(?![^>]*type=)[^>]*>([^]*?)<\/script>/g)].forEach(m=>console.log(c.createHash('sha256').update(m[1]).digest('base64')))"

  (The command also matches its own example inside this comment, so the first
  line it prints is not a real script; the hashes to publish are the ones of
  the actual inline scripts.)

  PayPal's card-fields SDK (expanded checkout, no PayPal account) is allowed
  explicitly, following PayPal's CSP guidance for the JS SDK v5 CardFields
  component: script, frame, child and connect to *.paypal.com and
  *.paypalobjects.com. Mercado Pago's Card Payment Brick is allowed with the
  exact hosts it needs: SDK and Brick assets, Secure Fields frames, the 3DS
  challenge frame, and payment API connections. Its SDK v2 inline bootstrap
  changes between loads, so Cloudflare Pages' functions/_middleware.js issues a
  fresh per-response CSP nonce and writes the same policy to the response header
  and this meta element. The application passes that nonce to the SDK as
  deviceProfileCspNonce; the option is implemented by the vendor bundle but is
  absent from its public TypeScript definitions. No Mercado Pago bootstrap hash
  is trusted in the static policy. Google Tag Manager is allowed for the
  container script and its beacons. The static meta and _headers copies keep the
  same allowances, and the middleware replaces both with the identical
  nonce-bearing policy on Cloudflare Pages.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-jYHg7tXSuuVUqjy+JeRT8vyG97+Spkw5IFHdQEBbmrw=' 'sha256-Y8gZRRAdU1zK6frCTDDEcEN+fvPKQZLtSHr+o1pW1Og=' 'sha256-GRqTQiLptG6wuhtB52asFIQM5iVu0U4w9MQbYH/xszE=' https://*.paypal.com https://*.paypalobjects.com https://www.googletagmanager.com https://static.cloudflareinsights.com https://sdk.mercadopago.com https://http2.mlstatic.com; style-src 'self' 'unsafe-inline' https://*.paypal.com https://*.paypalobjects.com https://sdk.mercadopago.com https://http2.mlstatic.com; img-src 'self' data: blob: https:; font-src 'self' data: https://http2.mlstatic.com; connect-src 'self' https://api.djlabs.cl https://*.paypal.com https://*.paypalobjects.com https://www.googletagmanager.com https://www.google-analytics.com https://cloudflareinsights.com https://api.mercadopago.com https://api-static.mercadopago.com https://sdk.mercadopago.com https://secure-fields.mercadopago.com https://secure-fields-stg.mercadopago.com https://http2.mlstatic.com; frame-src 'self' https://*.paypal.com https://*.paypalobjects.com https://www.googletagmanager.com https://secure-fields.mercadopago.com https://secure-fields-stg.mercadopago.com https://acs.mercadopago.com https://api.mercadopago.com; child-src 'self' https://*.paypal.com https://*.paypalobjects.com https://secure-fields.mercadopago.com https://secure-fields-stg.mercadopago.com https://acs.mercadopago.com; worker-src 'self' blob:; media-src 'self' data: blob: https:; manifest-src 'self'">

<script>
  // The saved theme, applied BEFORE the first paint: the landing and the app then
  // both come up in the right light, with no flash of the wrong one. A missing,
  // empty or unreadable stored state simply means the default dark theme.
  (function () {
    var theme = 'dark';
    try {
      var state = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
      if (state && state.theme === 'light') theme = 'light';
    } catch (e) { theme = 'dark'; }
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f2f2f7' : '#000000');
  })();
</script>
